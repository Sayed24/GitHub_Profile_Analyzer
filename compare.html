<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Compare GitHub Profiles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
<header class="topbar">
  <h1>Compare <span>GitHub Profiles</span></h1>
</header>

<main class="container">

  <!-- INPUTS -->
  <section class="card">
    <input id="user1" placeholder="First username" />
    <input id="user2" placeholder="Second username" />
    <button id="compareBtn">Compare</button>
  </section>

  <!-- RESULTS -->
  <section class="grid-2" id="comparison"></section>

</main>

<footer>
  <a href="index.html">← Back to Analyzer</a>
</footer>

<script src="js/api.js"></script>

<script>
  const btn = document.getElementById("compareBtn");
  const output = document.getElementById("comparison");

  btn.addEventListener("click", async () => {
    const u1 = document.getElementById("user1").value.trim();
    const u2 = document.getElementById("user2").value.trim();

    if (!u1 || !u2) return alert("Enter both usernames");

    output.innerHTML = "";

    try {
      const [userA, userB] = await Promise.all([
        getUser(u1),
        getUser(u2)
      ]);

      output.innerHTML = `
        ${renderCompareCard(userA)}
        ${renderCompareCard(userB)}
      `;
    } catch {
      alert("Comparison failed");
    }
  });

  function renderCompareCard(user) {
    return `
      <div class="card">
        <img src="${user.avatar_url}" width="80" />
        <h3>${user.login}</h3>
        <p>Repos: ${user.public_repos}</p>
        <p>Followers: ${user.followers}</p>
        <p>Following: ${user.following}</p>
      </div>
    `;
  }
</script>
</body>
</html>
