<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare GitHub Profiles</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- HEADER -->
  <header class="app-header">
    <a href="index.html" class="logo-link">
      <h1 class="logo">GitHub Analyzer</h1>
    </a>

    <nav class="header-actions">
      <a href="index.html" class="nav-link">Dashboard</a>
    </nav>
  </header>

  <!-- COMPARE INPUTS -->
  <section class="compare-inputs">
    <input
      type="text"
      id="user1Input"
      placeholder="First GitHub username"
      autocomplete="off"
    />
    <input
      type="text"
      id="user2Input"
      placeholder="Second GitHub username"
      autocomplete="off"
    />
    <button id="compareBtn">Compare</button>
  </section>

  <!-- LOADER -->
  <div id="compareLoader" class="loader hidden"></div>

  <!-- COMPARISON GRID -->
  <section class="compare-grid hidden" id="compareGrid">
    <!-- USER 1 -->
    <div class="card compare-card" id="user1Card">
      <div class="profile-header">
        <img id="avatar1" class="profile-avatar" alt="User 1 avatar" />
        <div class="profile-info">
          <h2 id="name1"></h2>
          <p id="username1" class="muted"></p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <span id="repos1">0</span>
          <small>Repos</small>
        </div>
        <div class="stat">
          <span id="followers1">0</span>
          <small>Followers</small>
        </div>
        <div class="stat">
          <span id="following1">0</span>
          <small>Following</small>
        </div>
      </div>

      <div class="ai-score compare-score">
        <span>AI Score</span>
        <strong><span id="score1">0</span>/100</strong>
      </div>
    </div>

    <!-- USER 2 -->
    <div class="card compare-card" id="user2Card">
      <div class="profile-header">
        <img id="avatar2" class="profile-avatar" alt="User 2 avatar" />
        <div class="profile-info">
          <h2 id="name2"></h2>
          <p id="username2" class="muted"></p>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat">
          <span id="repos2">0</span>
          <small>Repos</small>
        </div>
        <div class="stat">
          <span id="followers2">0</span>
          <small>Followers</small>
        </div>
        <div class="stat">
          <span id="following2">0</span>
          <small>Following</small>
        </div>
      </div>

      <div class="ai-score compare-score">
        <span>AI Score</span>
        <strong><span id="score2">0</span>/100</strong>
      </div>
    </div>
  </section>

  <!-- WINNER -->
  <section class="card hidden" id="winnerCard">
    <h3>🏆 Winner</h3>
    <p id="winnerText"></p>
  </section>

  <!-- SCRIPTS (ORDER IS IMPORTANT) -->
  <script src="js/api.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/compare.js"></script>
</body>
</html>
