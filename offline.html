<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

<body>

<main class="container">

  <section class="card" style="text-align:center; margin-top:3rem;">
    <h2>⚡ You’re Offline</h2>
    <p class="muted" style="margin-top:0.6rem;">
      No internet connection detected.
    </p>

      You can still:
    </p>

    <ul style="text-align:left; margin:1rem auto; max-width:420px;">
      <li>✔ View previously searched profiles</li>
      <li>✔ Access cached analytics</li>
      <li>✔ Use the app in PWA mode</li>
    </ul>

    <button
      onclick="window.location.href='index.html'"
      style="
        margin-top:1.2rem;
        padding:0.7rem 1.4rem;
        border-radius:10px;
        border:none;
        background:#58a6ff;
        color:#fff;
        font-weight:600;
        cursor:pointer;
      "
    >
      Go Back Home
    </button>
  </section>
