<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GitHub Analytics Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <meta name="description" content="Advanced GitHub profile analytics with real insights, charts, offline mode, and comparison." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<header class="topbar">
  <h1>GitHub Analytics <span>Pro</span></h1>
</header>

<main class="container">

  <!-- SEARCH -->
  <section class="card">
    <input id="usernameInput" type="text" placeholder="Enter GitHub username" />
    <button id="searchBtn">Analyze</button>
  </section>

  <!-- PROFILE -->
  <section id="profile" class="card hidden"></section>

  <!-- STATS -->
  <section id="stats" class="stats-grid hidden"></section>

  <!-- CHARTS -->
  <section class="grid-2 hidden" id="chartsSection">
    <div class="card">
      <canvas id="languageChart"></canvas>
    </div>
    <div class="card">
      <canvas id="starsChart"></canvas>
    </div>
  </section>

  <!-- CONTRIBUTIONS -->
  <section id="contributions" class="card hidden"></section>

  <!-- AI INSIGHTS -->
  <section id="aiInsights" class="card hidden"></section>

</main>

<footer>
  <a href="compare.html">Compare Two Users</a>
</footer>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>
</body>
</html>
