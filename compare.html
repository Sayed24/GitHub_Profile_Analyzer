<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Compare GitHub Profiles</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />

  <link rel="icon" href="assets/icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- Chart.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>Profile <span>Comparison</span></h1>
    <div class="top-actions">
      <a class="ghost-btn" href="index.html">← Back</a>
    </div>
  </div>
</header>

<main class="container">

  <!-- SEARCH -->
  <section class="card search-card">
    <input id="userA" type="text" placeholder="Username A" />
    <input id="userB" type="text" placeholder="Username B" />
    <button id="compareBtn">Compare</button>
  </section>

  <!-- ERROR -->
  <section id="compareError" class="error"></section>

  <!-- COMPARISON GRID -->
  <section class="grid-2">

    <!-- USER A -->
    <div class="card">
      <div id="profileA"></div>
      <div id="statsA" class="stats-grid"></div>
    </div>

    <!-- USER B -->
    <div class="card">
      <div id="profileB"></div>
      <div id="statsB" class="stats-grid"></div>
    </div>

  </section>

  <!-- LANGUAGE CHART -->
  <section class="card chart-card">
    <h3>Language Comparison</h3>
    <canvas id="compareChart"></canvas>
  </section>

  <!-- WINNER -->
  <section class="card" id="winnerCard">
    <h3>🏆 Comparison Result</h3>
    <p class="muted">Run a comparison to see the result.</p>
  </section>

</main>

<footer>
  <p>Side-by-side GitHub profile comparison</p>
</footer>

<!-- SCRIPTS -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/compare.js"></script>

</body>
</html>
