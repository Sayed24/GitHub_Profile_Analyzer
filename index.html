<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GitHub Profile Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<!-- OFFLINE BANNER -->
<div id="offlineBanner" class="offline hidden">
  You are offline — showing cached data if available
</div>

<!-- HEADER -->
<header class="topbar">
  <div class="topbar-inner">
    <h1>GitHub <span>Analyzer</span></h1>

    <div>
      <button id="installBtn" class="ghost-btn hidden">Install App</button>
      <button onclick="enablePushNotifications()" class="ghost-btn">
        Enable Notifications
      </button>
    </div>
  </div>
</header>

<main class="container">

  <!-- SEARCH -->
  <section class="card search-card">
    <input
      id="usernameInput"
      placeholder="Enter GitHub username"
      autocomplete="off"
    />
    <button id="searchBtn">Analyze</button>
  </section>

  <!-- HISTORY -->
  <section id="history" class="card"></section>

  <!-- ERROR -->
  <section id="error"></section>

  <!-- PROFILE -->
  <section id="profile" class="card"></section>

  <!-- STATS -->
  <section id="stats"></section>

  <!-- LANGUAGES -->
  <section class="card" style="height:320px">
    <h3>Language Usage</h3>
    <canvas id="languageChart"></canvas>
  </section>

  <!-- REPOS -->
  <section>
    <h3>Recent Repositories</h3>
    <div id="repos" class="grid-2"></div>
  </section>

  <!-- AI INSIGHTS -->
  <section class="card" id="aiInsights">
    <h3>AI Insights</h3>
  </section>

</main>

<footer>
  <div class="footer-nav">
    <a href="compare.html">Compare Profiles</a>
    <a href="https://github.com" target="_blank">GitHub</a>
  </div>
  <p>Built with GitHub API • PWA • Offline Ready</p>
</footer>

<!-- SCRIPTS (ORDER MATTERS) -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>

</body>
</html>
