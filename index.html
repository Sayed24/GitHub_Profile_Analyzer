<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Analyzer</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- HEADER -->
  <header class="app-header">
    <a href="index.html" class="logo-link">
      <h1 class="logo">GitHub Analyzer</h1>
    </a>

    <nav class="header-actions">
      <a href="compare.html" class="nav-link">Compare</a>
      <button id="themeToggle" aria-label="Toggle theme">🌙</button>
    </nav>
  </header>

  <!-- SEARCH -->
  <section class="search-section">
    <input
      type="text"
      id="usernameInput"
      placeholder="Enter GitHub username"
      autocomplete="off"
    />
    <button id="searchBtn">Analyze</button>
  </section>

  <!-- LOADER -->
  <div id="loader" class="loader hidden"></div>

  <!-- PROFILE CARD -->
  <section id="profileCard" class="card profile-card hidden">
    <div class="profile-header">
      <img
        id="avatar"
        class="profile-avatar"
        alt="GitHub profile avatar"
      />

      <div class="profile-info">
        <h2 id="name"></h2>
        <p id="username" class="muted"></p>
        <p id="bio"></p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat">
        <span id="repos">0</span>
        <small>Repos</small>
      </div>
      <div class="stat">
        <span id="followers">0</span>
        <small>Followers</small>
      </div>
      <div class="stat">
        <span id="following">0</span>
        <small>Following</small>
      </div>
    </div>

    <div class="profile-actions">
      <button id="exportPdfBtn">Export PDF</button>
    </div>
  </section>

  <!-- AI INSIGHTS -->
  <section id="aiCard" class="card ai-insights-card hidden">
    <h3>🤖 AI Insights</h3>
    <p id="aiInsights" class="ai-insights"></p>

    <div class="ai-score">
      <span>AI Score</span>
      <strong><span id="aiScore">0</span>/100</strong>
    </div>
  </section>

  <!-- LANGUAGE CHART -->
  <section id="chartCard" class="card hidden">
    <h3>📊 Language Usage</h3>
    <canvas id="languageChart"></canvas>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 GitHub Profile Analyzer</p>
  </footer>

  <!-- SCRIPTS (ORDER IS IMPORTANT) -->
  <script src="js/api.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/app.js"></script>

  <!-- SERVICE WORKER -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
