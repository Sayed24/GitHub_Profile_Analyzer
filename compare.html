<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compare GitHub Profiles</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="logo" onclick="location.href='index.html'">GitHub Analyzer</div>
    <div class="header-actions">
      <button id="themeToggle">🌙</button>
    </div>
  </header>

  <!-- SEARCH -->
  <section class="search-section">
    <input id="user1" placeholder="First username" />
    <input id="user2" placeholder="Second username" />
    <button onclick="compare()">Compare</button>
  </section>

  <!-- LOADING -->
  <div id="loading" class="loading hidden">Comparing profiles…</div>

  <!-- RESULTS -->
  <main class="profile-container" id="compareContainer"></main>

  <script>
    const API = "https://api.github.com/users";
    const container = document.getElementById("compareContainer");
    const loading = document.getElementById("loading");
    const themeToggle = document.getElementById("themeToggle");

    // Theme
    if (localStorage.getItem("theme") === "light") {
      document.body.classList.add("light");
    }
    themeToggle.onclick = () => {
      document.body.classList.toggle("light");
      localStorage.setItem(
        "theme",
        document.body.classList.contains("light") ? "light" : "dark"
      );
    };

    async function fetchUser(username) {
      const res = await fetch(`${API}/${username}`);
      if (!res.ok) throw new Error("User not found");
      return res.json();
    }

    async function compare() {
      const u1 = document.getElementById("user1").value.trim();
      const u2 = document.getElementById("user2").value.trim();
      if (!u1 || !u2) return alert("Enter both usernames");

      loading.classList.remove("hidden");
      container.innerHTML = "";

      try {
        const [userA, userB] = await Promise.all([
          fetchUser(u1),
          fetchUser(u2)
        ]);

        renderUser(userA);
        renderUser(userB);
      } catch (e) {
        alert(e.message);
      } finally {
        loading.classList.add("hidden");
      }
    }

    function renderUser(user) {
      const card = document.createElement("div");
      card.className = "card profile-card";

      card.innerHTML = `
        <img src="${user.avatar_url}" />
        <div class="profile-info">
          <h2>${user.login}</h2>
          <p>${user.bio || "No bio"}</p>
          <div class="stats">
            <div><span>${user.followers}</span><br>Followers</div>
            <div><span>${user.public_repos}</span><br>Repos</div>
            <div><span>${user.following}</span><br>Following</div>
          </div>
        </div>
      `;
      container.appendChild(card);
    }
  </script>
</body>
</html>
