<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Analyzer</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h1>GitHub Profile Analyzer</h1>
    <button id="themeToggle" aria-label="Toggle dark mode">🌙</button>
  </header>

  <!-- SEARCH -->
  <section class="search-section">
    <form id="searchForm">
      <input
        type="text"
        id="usernameInput"
        placeholder="Enter GitHub username"
        autocomplete="off"
        required
      />
      <button type="submit">Analyze</button>
    </form>

    <div id="history" class="history"></div>
    <div id="error" class="error"></div>
  </section>

  <section class="card">
  <h2>Compare Profiles</h2>
  <div class="compare-form">
    <input id="compareUser1" placeholder="Username 1" />
    <input id="compareUser2" placeholder="Username 2" />
    <button onclick="compareUsers(
      compareUser1.value,
      compareUser2.value
    )">Compare</button>
  </div>
</section>

<section id="comparison"></section>

  <!-- LOADER -->
  <div id="loader" class="loader">Loading...</div>
<button onclick="exportPDF()">Export PDF</button>
  <!-- PROFILE -->
  <main id="content">

    <!-- PROFILE OVERVIEW -->
    <section id="profile" class="card profile"></section>

    <!-- STATS -->
    <section id="stats" class="stats-grid"></section>

    <!-- CHARTS -->
    <section class="charts">
      <div class="card">
        <h3>Languages</h3>
        <canvas id="languageChart"></canvas>
      </div>
      <div class="card">
        <h3>Top Starred Repos</h3>
        <canvas id="starsChart"></canvas>
      </div>
    </section>

    <!-- REPOSITORIES -->
    <section id="repos" class="repos-grid"></section>

  </main>

  <!-- SCRIPTS (ORDER MATTERS) -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/main.js"></script>
  <script src="js/compare.js"></script>

</body>
</html>
