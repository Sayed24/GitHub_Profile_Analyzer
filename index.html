<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Analyzer</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="app-header">
    <div id="logo" class="logo">GitHub Analyzer</div>

    <div class="header-actions">
      <a href="compare.html" class="compare-link">Compare</a>
      <button id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- SEARCH -->
  <section class="search-section">
    <input
      id="usernameInput"
      type="text"
      placeholder="Enter GitHub username"
      autocomplete="off"
    />
    <button id="searchBtn">Search</button>
  </section>

  <!-- LOADING -->
  <div id="loading" class="loading hidden">Loading GitHub profile…</div>

  <!-- MAIN CONTENT -->
  <main id="profileContainer" class="profile-container"></main>

  <!-- SCRIPT -->
  <script src="app.js"></script>

  <!-- PWA REGISTER -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js");
      });
    }
  </script>
</body>
</html>
