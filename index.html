<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GitHub Analytics Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- SEO -->
  <meta name="description" content="Advanced GitHub profile analytics with charts, insights, offline mode, and PWA support." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>GitHub Analytics <span>Pro</span></h1>

    <div class="top-actions">
      <button id="installBtn" class="ghost-btn hidden">Install App</button>
      <button id="notifyBtn" class="ghost-btn">Enable Alerts</button>
    </div>
  </div>
</header>

<!-- OFFLINE BANNER -->
<div id="offlineBanner" class="offline hidden">
  You are offline. Showing cached data.
</div>

<main class="container">

  <!-- SEARCH -->
  <section class="card search-card">
    <input
      id="usernameInput"
      type="text"
      placeholder="Enter GitHub username"
      autocomplete="off"
    />
    <button id="searchBtn">Analyze</button>
  </section>

  <!-- PROFILE -->
  <section id="profile" class="card hidden"></section>

  <!-- STATS -->
  <section id="stats" class="stats-grid hidden"></section>

  <!-- CHARTS -->
  <section id="chartsSection" class="grid-2 hidden">
    <div class="card">
      <h3>Language Usage</h3>
      <canvas id="languageChart"></canvas>
    </div>
    <div class="card">
      <h3>Top Repositories</h3>
      <canvas id="starsChart"></canvas>
    </div>
  </section>

  <!-- CONTRIBUTIONS -->
  <section id="contributions" class="card hidden"></section>

  <!-- AI INSIGHTS -->
  <section id="aiInsights" class="card hidden"></section>

</main>

<footer>
  <nav class="footer-nav">
    <a href="compare.html">Compare Profiles</a>
    <span>•</span>
    <span>Offline & PWA Ready</span>
  </nav>
</footer>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
  }
</script>

</body>
</html>
