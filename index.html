<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Profile Analyzer</title>

  <link rel="stylesheet" href="css/styles.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header class="header">
  <h1>GitHub Profile Analyzer</h1>
  <button id="themeToggle">🌙</button>
</header>

<main class="container">

  <!-- SEARCH -->
  <section class="search-section card glass">
    <input id="usernameInput" placeholder="Enter GitHub username">
    <button id="searchBtn">Analyze</button>
  </section>

  <!-- HISTORY -->
  <section id="history" class="history"></section>

  <!-- LOADER -->
  <div id="loader" class="loader hidden"></div>
  <p id="error" class="error hidden"></p>

  <!-- PROFILE -->
  <section id="profile" class="hidden"></section>

  <!-- STATS -->
  <section id="stats" class="stats hidden"></section>

  <!-- REPO CONTROLS -->
  <section class="card repo-controls hidden" id="repoControls">
    <select id="sortRepos">
      <option value="stars">Sort by Stars</option>
      <option value="forks">Sort by Forks</option>
      <option value="updated">Last Updated</option>
    </select>

    <select id="filterLang">
      <option value="all">All Languages</option>
    </select>
  </section>

  <!-- CHART -->
  <section id="chartCard" class="card hidden">
    <h3>Language Usage</h3>
    <canvas id="languageChart"></canvas>
  </section>

  <!-- REPOS -->
  <section id="repos" class="repos hidden"></section>

  <!-- COMPARE -->
  <section class="card glass">
    <h3>Compare Profiles</h3>
    <input id="userA" placeholder="First username">
    <input id="userB" placeholder="Second username">
    <button id="compareBtn">Compare</button>
  </section>

  <section id="compareResult" class="compare-grid hidden"></section>

  <section id="compareChartCard" class="card hidden">
    <h3>Language Comparison</h3>
    <canvas id="compareChart"></canvas>
  </section>

</main>

<footer class="footer">
  Portfolio Project • GitHub API
</footer>

<!-- JS FILES (ORDER MATTERS) -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/theme.js"></script>
<script src="js/main.js"></script>

</body>
</html>
