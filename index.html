<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profile Analyzer</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1117" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- Header -->
  <header class="app-header">
    <h1 class="logo" onclick="location.href='index.html'">GitHub Analyzer</h1>

    <div class="header-actions">
      <button id="themeToggle" aria-label="Toggle theme">🌙</button>
      <a href="compare.html" class="compare-link">Compare</a>
    </div>
  </header>

  <!-- Search -->
  <section class="search-section">
    <input
      type="text"
      id="usernameInput"
      placeholder="Enter GitHub username…"
      autocomplete="off"
    />
    <button id="searchBtn">Analyze</button>
  </section>

  <!-- Loading -->
  <div id="loading" class="loading hidden">Loading profile…</div>

  <!-- Profile -->
  <main id="profileContainer" class="profile-container hidden">
    <!-- Profile Card -->
    <section class="card profile-card">
      <img id="avatar" alt="Profile Avatar" />
      <div class="profile-info">
        <h2 id="name"></h2>
        <p id="bio"></p>

        <div class="stats">
          <div><span id="repos"></span><small>Repos</small></div>
          <div><span id="followers"></span><small>Followers</small></div>
          <div><span id="following"></span><small>Following</small></div>
        </div>
      </div>
    </section>

    <!-- AI Insights -->
    <section class="card ai-card">
      <h3>AI Insights</h3>
      <p id="aiInsights">
        Analyze a profile to generate insights.
      </p>
      <div class="ai-score">
        <span>AI Score</span>
        <strong id="aiScore">–</strong>
      </div>
    </section>

    <!-- Repositories -->
    <section class="card repos-card">
      <h3>Repositories</h3>
      <ul id="repoList"></ul>
    </section>

    <!-- Actions -->
    <section class="card actions-card">
      <button id="exportPdf">Export PDF</button>
    </section>
  </main>

  <!-- Scripts -->
  <script src="app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
